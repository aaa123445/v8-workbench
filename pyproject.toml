[project]
name = "v8-workbench"
version = "0.1.0"
description = "致远 V8 客开工作台 — 面向本地 AI Agent 的知识检索与开发规范服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "mcp>=1.2",
]

[project.scripts]
wb = "cli.wb:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "cli"]
