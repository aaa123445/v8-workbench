[project]
name = "v8-workbench"
version = "0.5.0"
description = "TeamKB 团队知识共享平台 — 分类检索、贡献审核与 Agent 经验沉淀"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "mcp>=1.2",
]

[project.scripts]
wb = "cli.wb:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "cli"]
