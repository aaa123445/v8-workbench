# Nginx 反代示例。
# 工作台本身只监听 127.0.0.1:8770，对外统一走这里加 TLS。
#
# 放到 /etc/nginx/conf.d/v8wb.conf，改掉 server_name 和证书路径。

server {
    listen 443 ssl http2;
    server_name workbench.example.com;

    ssl_certificate     /etc/letsencrypt/live/workbench.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workbench.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 知识上传可能带长文档，放开请求体上限
    client_max_body_size 32m;

    # 语雀全量同步是长请求，超时给足
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 文档页和 openapi 暴露了接口结构，按需关闭
    location ~ ^/(docs|openapi\.json) {
        # 只允许内网访问
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name workbench.example.com;
    return 301 https://$host$request_uri;
}
